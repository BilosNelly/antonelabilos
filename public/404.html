<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Antonela Bilos</title>
    <script>
      // GitHub Pages SPA redirect: rewrite /some/path to /?/some/path so
      // index.html can restore it. pathSegmentsToKeep = 0 for a custom domain.
      (function (l) {
        var pathSegmentsToKeep = 0
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
